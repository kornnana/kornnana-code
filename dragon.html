<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑽石龍 | Diamond Dragon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.6' },
                            '50%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 繽紛漸層文字 */
        .vibrant-gradient-text {
            background: linear-gradient(135deg, #FF3366 0%, #FF6B00 30%, #9800FF 70%, #00D2FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 背景流動光暈 */
        .glow-blob-1 {
            background: radial-gradient(circle, rgba(255, 99, 132, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
        }
        .glow-blob-2 {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
        }
        .glow-blob-3 {
            background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
        }

        /* 亮麗炫彩邊框 */
        .rainbow-border {
            background: linear-gradient(135deg, #FF2E93, #FF8A00, #00E5FF, #7000FF);
            padding: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden relative selection:bg-pink-500 selection:text-white">

    <!-- 動態背景亮彩光暈效果 -->
    <div class="fixed top-[-10vw] left-[-10vw] w-[50vw] h-[50vw] glow-blob-1 blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="fixed bottom-[-10vw] right-[-10vw] w-[55vw] h-[55vw] glow-blob-2 blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 1.5s;"></div>
    <div class="fixed top-[40%] right-[10%] w-[35vw] h-[35vw] glow-blob-3 blur-3xl pointer-events-none"></div>

    <!-- 主體內容區塊 (垂直置中) -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10">
        <div class="max-w-xl w-full">

            <!-- 主卡片 -->
            <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 md:p-10 border border-white/90 shadow-2xl shadow-indigo-500/10 text-center relative overflow-hidden transition-all">
                
                <!-- 頂部繽紛彩條 dekor -->
                <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-pink-500 via-amber-400 via-emerald-400 via-sky-400 to-purple-600"></div>

                <!-- 1. 個人照片預留區塊 (Avatar / Photo Placeholder) -->
                <div class="relative w-36 h-36 md:w-44 md:h-44 mx-auto mb-6 group animate-float">
                    <!-- 外圍旋轉/脈衝光暈 -->
                    <div class="absolute -inset-1 rounded-full rainbow-border blur-md opacity-75 group-hover:opacity-100 transition duration-500"></div>
                    
                    <!-- 照片圓框邊框 -->
                    <div class="relative w-full h-full rounded-full rainbow-border shadow-xl overflow-hidden p-1 bg-white">
                        <!-- ★ 在此處可替換您的個人照片 (將 src 改為您的圖片網址) ★ -->
                        <img 
                            src="https://placehold.co/400x400/FFF0F5/FF2E93?text=%E7%85%A7%E7%89%87%E9%A0%90%E7%95%99%E4%BD%8D%E7%BD%AE" 
                            alt="鑽石龍個人照片" 
                            class="w-full h-full object-cover rounded-full bg-slate-100 transition duration-300 group-hover:scale-105"
                            onerror="this.onerror=null; this.src='https://placehold.co/400x400/FFF0F5/FF2E93?text=鑽石龍';"
                        />
                    </div>

                    <!-- 小亮點徽章 -->
                    <span class="absolute bottom-1 right-1 bg-gradient-to-r from-amber-400 to-orange-500 text-white p-2.5 rounded-full shadow-lg border-2 border-white text-xs flex items-center justify-center">
                        <i class="fa-solid fa-basketball"></i>
                    </span>
                </div>

                <!-- 2. 姓名與主標題 -->
                <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-2">
                    <span class="vibrant-gradient-text">鑽石龍</span>
                </h1>
                
                <!-- 科系標籤 -->
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900 text-white font-bold text-xs tracking-wider uppercase mb-6 shadow-md shadow-slate-900/20">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    數位多媒體系
                </div>

                <!-- 3. 極簡自我介紹 (興趣與技能簡寫) -->
                <div class="bg-slate-50/80 border border-slate-100 rounded-2xl p-4 mb-8 shadow-inner">
                    <p class="text-slate-700 font-bold text-base md:text-lg mb-2">
                        「 喜歡打籃球 🏀 」
                    </p>
                    <div class="flex flex-wrap justify-center gap-2 text-xs font-semibold">
                        <span class="px-3 py-1 rounded-lg bg-pink-100 text-pink-700 border border-pink-200/60">
                            <i class="fa-solid fa-book-open mr-1"></i>讀書
                        </span>
                        <span class="px-3 py-1 rounded-lg bg-sky-100 text-sky-700 border border-sky-200/60">
                            <i class="fa-solid fa-person-running mr-1"></i>運動
                        </span>
                        <span class="px-3 py-1 rounded-lg bg-purple-100 text-purple-700 border border-purple-200/60">
                            <i class="fa-solid fa-basketball mr-1"></i>籃球專長
                        </span>
                    </div>
                </div>

                <!-- 4. 亮亮互動聯絡按鈕群 (一鍵複製) -->
                <div class="space-y-3">
                    <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">聯絡方式 (點擊複製)</p>

                    <!-- Email 按鈕 -->
                    <button onclick="copyToClipboard('kornnaja1204@gmail.com', 'Email')" class="w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-semibold shadow-lg shadow-pink-500/25 hover:shadow-pink-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-between group">
                        <span class="flex items-center gap-3 text-sm">
                            <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center text-white">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <span>Email</span>
                        </span>
                        <span class="text-xs bg-white/20 px-3 py-1 rounded-lg group-hover:bg-white group-hover:text-pink-600 transition-colors">
                            kornnaja1204@gmail.com
                        </span>
                    </button>

                    <!-- Line 按鈕 -->
                    <button onclick="copyToClipboard('Mangkornpet Bunphim', 'Line')" class="w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-between group">
                        <span class="flex items-center gap-3 text-sm">
                            <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center text-white">
                                <i class="fa-brands fa-line text-lg"></i>
                            </div>
                            <span>Line</span>
                        </span>
                        <span class="text-xs bg-white/20 px-3 py-1 rounded-lg group-hover:bg-white group-hover:text-emerald-700 transition-colors">
                            Mangkornpet Bunphim
                        </span>
                    </button>

                    <!-- Instagram 按鈕 -->
                    <button onclick="copyToClipboard('mpsrrt12', 'Instagram')" class="w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white font-semibold shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-between group">
                        <span class="flex items-center gap-3 text-sm">
                            <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center text-white">
                                <i class="fa-brands fa-instagram text-lg"></i>
                            </div>
                            <span>Instagram</span>
                        </span>
                        <span class="text-xs bg-white/20 px-3 py-1 rounded-lg group-hover:bg-white group-hover:text-purple-700 transition-colors">
                            @mpsrrt12
                        </span>
                    </button>
                </div>

            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="py-4 text-center relative z-10">
        <p class="text-xs font-semibold text-slate-400">
            &copy; <span id="year"></span> 鑽石龍 (Diamond Dragon) • 數位多媒體系
        </p>
    </footer>

    <!-- Toast 提示 popup -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <div class="bg-slate-900/90 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl border border-white/20 flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 text-white flex items-center justify-center text-xs font-bold">
                <i class="fa-solid fa-check"></i>
            </span>
            <span id="toast-message" class="text-sm font-semibold tracking-wide">已複製成功！</span>
        </div>
    </div>

    <script>
        // 設定年份
        document.getElementById('year').textContent = new Date().getFullYear();

        // 剪貼簿複製
        function copyToClipboard(text, label) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showToast('已複製 ' + label + '：' + text);
                } else {
                    showToast('複製失敗，請手動複製');
                }
            } catch (err) {
                showToast('複製失敗，請手動複製');
            }
            
            document.body.removeChild(textarea);
        }

        // Toast 彈窗控制
        function showToast(message) {
            var toast = document.getElementById('toast');
            var toastMsg = document.getElementById('toast-message');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(function() {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
